syntax = "proto3";

import "SiLAFramework.proto";

package sila2.org.silalearning.examples.camerastreamprovider.v1;

/* Provides a live camera feed from an IP camera (HTTP/RTSP) or USB webcam. The stream can be started with a source URL or device index and frames are captured in a background thread. Clients retrieve individual JPEG frames via GetLatestFrame, or the web UI can display a continuous MJPEG stream via the Flask proxy endpoint. */
service CameraStreamProvider {
  /* Begin capturing frames from a camera source. The Source parameter accepts an HTTP/RTSP URL for IP cameras (e.g. "http://192.168.1.100/mjpg/video.mjpg") or a device index string for USB webcams (e.g. "0" for the first camera). */
  rpc StartStream (sila2.org.silalearning.examples.camerastreamprovider.v1.StartStream_Parameters) returns (sila2.org.silalearning.examples.camerastreamprovider.v1.StartStream_Responses) {}
  /* Stop the camera capture and release the device. */
  rpc StopStream (sila2.org.silalearning.examples.camerastreamprovider.v1.StopStream_Parameters) returns (sila2.org.silalearning.examples.camerastreamprovider.v1.StopStream_Responses) {}
  /* Return the most recently captured JPEG frame from the camera. The stream must be started first via StartStream. */
  rpc GetLatestFrame (sila2.org.silalearning.examples.camerastreamprovider.v1.GetLatestFrame_Parameters) returns (sila2.org.silalearning.examples.camerastreamprovider.v1.GetLatestFrame_Responses) {}
  /* Whether the camera capture is currently active. */
  rpc Get_IsStreaming (sila2.org.silalearning.examples.camerastreamprovider.v1.Get_IsStreaming_Parameters) returns (sila2.org.silalearning.examples.camerastreamprovider.v1.Get_IsStreaming_Responses) {}
}

/* Parameters for StartStream */
message StartStream_Parameters {
  sila2.org.silastandard.String Source = 1;  /* Camera source: an HTTP/RTSP URL for IP cameras, or a device index (e.g. "0", "1") for USB webcams. */
}

/* Responses of StartStream */
message StartStream_Responses {
}

/* Parameters for StopStream */
message StopStream_Parameters {
}

/* Responses of StopStream */
message StopStream_Responses {
}

/* Parameters for GetLatestFrame */
message GetLatestFrame_Parameters {
}

/* Responses of GetLatestFrame */
message GetLatestFrame_Responses {
  sila2.org.silastandard.Binary Frame = 1;  /* The latest camera frame as JPEG binary data. */
}

/* Parameters for IsStreaming */
message Get_IsStreaming_Parameters {
}

/* Responses of IsStreaming */
message Get_IsStreaming_Responses {
  sila2.org.silastandard.Boolean IsStreaming = 1;  /* Whether the camera capture is currently active. */
}
