# Tailscale auth key — override via vault or extra vars
# For Headscale: generated by `headscale preauthkeys create`
# For Tailscale SaaS: generate at https://login.tailscale.com/admin/settings/keys
# Path to the Tailscale installer on the control node (for Windows targets)
tailscale_installer_path: "{{ playbook_dir }}/../tailscale-setup-full-1.94.2.exe"

tailscale_auth_key: "{{ vault_tailscale_auth_key | default('') }}"

# Headscale login server URL (set in group_vars/all.yml after deploying Headscale)
# When defined, clients use --login-server to register with Headscale
# When empty/undefined, clients use the default Tailscale SaaS control plane
tailscale_login_server: "{{ headscale_server_url | default('') }}"
