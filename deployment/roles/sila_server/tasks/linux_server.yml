---
# Per-server Linux deployment (runs once per server in the sila_servers list)
# Variables sila_package, sila_port, sila_extra_args are set by the caller loop.

- name: "{{ sila_package }}: Create install directory"
  file:
    path: "{{ sila_install_dir_linux }}/{{ sila_package }}"
    state: directory
    mode: "0755"
  become: true

- name: "{{ sila_package }}: Sync server package from control node"
  synchronize:
    src: "{{ sila_repo_path }}/servers/{{ sila_package }}/"
    dest: "{{ sila_install_dir_linux }}/{{ sila_package }}/"
    delete: true
    rsync_opts:
      - "--exclude=__pycache__"
      - "--exclude=*.pyc"
      - "--exclude=.venv"

- name: "{{ sila_package }}: Copy requirements.txt"
  copy:
    src: "{{ sila_repo_path }}/requirements.txt"
    dest: "{{ sila_install_dir_linux }}/{{ sila_package }}/requirements.txt"

- name: "{{ sila_package }}: Create virtual environment"
  command: >
    {{ python_executable_linux }} -m venv
    {{ sila_install_dir_linux }}/{{ sila_package }}/{{ sila_venv_dir }}
  args:
    creates: "{{ sila_install_dir_linux }}/{{ sila_package }}/{{ sila_venv_dir }}/bin/python"

- name: "{{ sila_package }}: Install dependencies"
  pip:
    requirements: "{{ sila_install_dir_linux }}/{{ sila_package }}/requirements.txt"
    virtualenv: "{{ sila_install_dir_linux }}/{{ sila_package }}/{{ sila_venv_dir }}"

- name: "{{ sila_package }}: Install server package in editable mode"
  pip:
    name: "-e ."
    chdir: "{{ sila_install_dir_linux }}/{{ sila_package }}"
    virtualenv: "{{ sila_install_dir_linux }}/{{ sila_package }}/{{ sila_venv_dir }}"

- name: "{{ sila_package }}: Deploy systemd service file"
  template:
    src: sila-server.service.j2
    dest: "/etc/systemd/system/{{ sila_service_prefix }}-{{ sila_package }}.service"
    mode: "0644"
  become: true
  notify: Restart sila service

- name: "{{ sila_package }}: Enable and start service"
  systemd:
    name: "{{ sila_service_prefix }}-{{ sila_package }}"
    enabled: true
    state: started
    daemon_reload: true
  become: true
