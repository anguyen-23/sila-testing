# SiLA 2 Server Fleet Inventory
#
# Each host defines a `sila_servers` list of servers to deploy.
# Server-type groups exist for targeting with -l (e.g. -l multidrop_combi).
#
# Usage:
#   ansible-playbook playbooks/deploy.yml -l venus_api       # deploy one server type
#   ansible-playbook playbooks/deploy.yml -l f311-w11-2494   # deploy all servers on a host
#   ansible-playbook playbooks/deploy.yml                    # deploy everything
#   ansible all -m ping                                      # check connectivity

all:
  children:
    # ── Server groups (for -l targeting) ─────────────────────
    # These groups contain NO vars — server config lives in sila_servers per host.

    venus_api:
      hosts:
        e372-w11-2428:

    temperature_controller:
      hosts:
        f311-w11-2494:

    multidrop_combi:
      hosts:
        f311-w11-2494:

    pump_controller:
      hosts: {}

    plate_reader:
      hosts: {}

    barcode_scanner:
      hosts: {}

    phenix_imager:
      hosts: {}

    micronic_tube_scanner:
      hosts: {}

    # ── Headscale control server ────────────────────────────
    headscale:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: /usr/bin/python3

    # ── Platform groups ─────────────────────────────────────
    # Hosts inherit connection settings from group_vars/

    windows:
      hosts:
        e372-w11-2428:
          sila_servers:
            - package: venus_api
              port: 50056
              extra_args: ""
        f311-w11-2494:
          sila_servers:
            - package: temperature_controller
              port: 50052
            - package: multidrop_combi
              port: 50055

    linux:
      children:
        pump_controller: {}
        plate_reader: {}
