---
# Per-server Windows status check (included by status.yml)

- name: "{{ sila_package }}: Check if installed"
  win_stat:
    path: "{{ sila_install_dir_windows }}\\{{ sila_package }}\\{{ sila_venv_dir }}\\Scripts\\python.exe"
  register: win_venv

- name: "{{ sila_package }}: Check service status"
  win_command: >
    {{ nssm_path }} status {{ sila_service_prefix }}-{{ sila_package }}
  register: win_service
  failed_when: false
  changed_when: false

- name: "{{ sila_package }}: Report"
  debug:
    msg: >
      Host={{ inventory_hostname }}
      Package={{ sila_package }}
      Port={{ sila_port }}
      Installed={{ win_venv.stat.exists | default(false) }}
      Service={{ win_service.stdout | default('not registered') | trim }}
